<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 120" width="350" height="120" role="img" aria-label="Synchrotron Motion Simulator">
  <title>Synchrotron Motion Simulator</title>
  <defs>
    <linearGradient id="smsTrailW" gradientUnits="userSpaceOnUse" x1="27.5" y1="27.5" x2="92.5" y2="27.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="smsBucketW" cx="55%" cy="50%" r="55%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="smsGlowW" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sms-title { fill: #1E293B; }
      .sms-sub   { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .sms-title { fill: #E2E8F0; }
        .sms-sub   { fill: #94A3B8; }
      }
    </style>
  </defs>

  <g transform="translate(2 13) scale(0.78)">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="5"/>
    <path d="M33.1,60 C43.2,41.5 49.9,39.8 58.3,39.8 C70.1,39.8 86.9,46.6 86.9,60 C86.9,73.4 70.1,80.2 58.3,80.2 C49.9,80.2 43.2,78.5 33.1,60 Z"
          fill="url(#smsBucketW)" stroke="#38BDF8" stroke-width="2.8" stroke-linejoin="round"/>
    <ellipse cx="63" cy="60" rx="8" ry="3.4" transform="rotate(-22 63 60)" fill="#FBBF24" fill-opacity="0.2"/>
    <g fill="#FBBF24" fill-opacity="0.95">
      <circle cx="58" cy="60.9" r="1.9"/>
      <circle cx="61.8" cy="61.6" r="1.9"/>
      <circle cx="64.2" cy="58.4" r="1.9"/>
      <circle cx="67.9" cy="58.8" r="1.9"/>
    </g>
    <path d="M27.5,27.5 A46,46 0 0 1 92.5,27.5" fill="none" stroke="url(#smsTrailW)" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#smsGlowW)">
      <circle cx="92.5" cy="27.5" r="7" fill="#FBBF24"/>
      <circle cx="92.5" cy="27.5" r="3" fill="#FFFBEB"/>
    </g>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="sms-title" x="108" y="57" font-size="27" font-weight="700" letter-spacing="1.1">SYNCHROTRON</text>
    <text class="sms-sub" x="110" y="81" font-size="14.5" font-weight="500" letter-spacing="4">MOTION SIMULATOR</text>
  </g>
</svg>
