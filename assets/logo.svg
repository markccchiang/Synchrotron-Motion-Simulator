<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Synchrotron Motion Simulator">
  <title>Synchrotron Motion Simulator</title>
  <defs>
    <linearGradient id="smsTrail" gradientUnits="userSpaceOnUse" x1="27.5" y1="27.5" x2="92.5" y2="27.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="smsBucket" cx="55%" cy="50%" r="55%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="smsGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- booster ring -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="5"/>

  <!-- RF bucket: accelerating separatrix (phi_s > 0), cusp at the unstable fixed point -->
  <path d="M33.1,60 C43.2,41.5 49.9,39.8 58.3,39.8 C70.1,39.8 86.9,46.6 86.9,60 C86.9,73.4 70.1,80.2 58.3,80.2 C49.9,80.2 43.2,78.5 33.1,60 Z"
        fill="url(#smsBucket)" stroke="#38BDF8" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- captured bunch, tilted at the synchronous phase -->
  <g>
    <ellipse cx="63" cy="60" rx="8" ry="3.4" transform="rotate(-22 63 60)" fill="#FBBF24" fill-opacity="0.2"/>
    <g fill="#FBBF24" fill-opacity="0.95">
      <circle cx="58" cy="60.9" r="1.9"/>
      <circle cx="61.8" cy="61.6" r="1.9"/>
      <circle cx="64.2" cy="58.4" r="1.9"/>
      <circle cx="67.9" cy="58.8" r="1.9"/>
    </g>
  </g>

  <!-- circulating beam: trail + particle -->
  <path d="M27.5,27.5 A46,46 0 0 1 92.5,27.5" fill="none" stroke="url(#smsTrail)" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#smsGlow)">
    <circle cx="92.5" cy="27.5" r="7" fill="#FBBF24"/>
    <circle cx="92.5" cy="27.5" r="3" fill="#FFFBEB"/>
  </g>
</svg>
